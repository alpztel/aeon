<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <radialGradient id="planet-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF5A1F" stop-opacity="0.95" />
      <stop offset="45%" stop-color="#FF5A1F" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FF5A1F" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="orbit-arc" x1="14" y1="86" x2="114" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9DB4F0" stop-opacity="0.95" />
      <stop offset="62%" stop-color="#9DB4F0" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#FF5A1F" stop-opacity="0.95" />
    </linearGradient>
  </defs>

  <!-- SPHEREx Nested Conical Scan Rings inside the A-cone -->
  <ellipse cx="64" cy="96" rx="26" ry="6.5" stroke="#ECE8E3" stroke-opacity="0.55" stroke-width="1.4" />
  <ellipse cx="64" cy="88" rx="22.5" ry="5.5" stroke="#ECE8E3" stroke-opacity="0.48" stroke-width="1.3" />
  <ellipse cx="64" cy="80" rx="19" ry="4.6" stroke="#ECE8E3" stroke-opacity="0.42" stroke-width="1.2" />
  <ellipse cx="64" cy="72" rx="15.5" ry="3.7" stroke="#ECE8E3" stroke-opacity="0.36" stroke-width="1.15" />
  <ellipse cx="64" cy="64" rx="12" ry="2.8" stroke="#ECE8E3" stroke-opacity="0.3" stroke-width="1.1" />
  <ellipse cx="64" cy="56" rx="8.5" ry="2" stroke="#ECE8E3" stroke-opacity="0.24" stroke-width="1" />

  <!-- Geometric Aerospace 'A' Struts (SPHEREx Survey Cone) -->
  <path
    d="M36 96L59.5 24H68.5L92 96H80.5L64 41L47.5 96H36Z"
    fill="#ECE8E3"
  />

  <!-- Inclined 520 AU Planet X Heliocentric Orbit Ring -->
  <ellipse
    cx="64"
    cy="64"
    rx="54"
    ry="19"
    transform="rotate(-24 64 64)"
    stroke="url(#orbit-arc)"
    stroke-width="3.2"
    stroke-linecap="round"
  />

  <!-- Infrared Thermal Planet X Node (#FF5A1F) -->
  <circle cx="98" cy="49" r="14" fill="url(#planet-glow)" />
  <circle cx="98" cy="49" r="5.5" fill="#FF5A1F" />
</svg>
