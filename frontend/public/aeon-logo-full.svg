<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" fill="none">
  <defs>
    <linearGradient id="aeon-orbit-stroke" x1="112" y1="128" x2="518" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ECE8E3" stop-opacity="0.95" />
      <stop offset="42%" stop-color="#9DB4F0" stop-opacity="1" />
      <stop offset="82%" stop-color="#ECE8E3" stop-opacity="1" />
      <stop offset="100%" stop-color="#FF5A1F" stop-opacity="1" />
    </linearGradient>
    <radialGradient id="px-node-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF5A1F" stop-opacity="0.95" />
      <stop offset="45%" stop-color="#FF5A1F" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FF5A1F" stop-opacity="0" />
    </radialGradient>
    <pattern id="astrometric-ticks" width="12" height="10" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#ECE8E3" stroke-opacity="0.22" stroke-width="1" />
      <line x1="6" y1="0" x2="6" y2="3" stroke="#ECE8E3" stroke-opacity="0.14" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Deep Obsidian Space Canvas -->
  <rect width="720" height="220" rx="18" fill="#050506" />
  <rect x="1" y="1" width="718" height="218" rx="17" stroke="#ECE8E3" stroke-opacity="0.1" />

  <!-- ================= CONCEPT 2 CUSTOM GEOMETRIC WORDMARK: A E O N ================= -->
  <!-- Letter A -->
  <path
    d="M92 136L136 48H154L198 136H179L145 65L111 136H92Z"
    fill="#ECE8E3"
  />

  <!-- Letter E -->
  <path
    d="M236 48H318V63H254V85H308V100H254V121H318V136H236V48Z"
    fill="#ECE8E3"
  />

  <!-- Letter O -->
  <circle
    cx="412"
    cy="92"
    r="37"
    stroke="#ECE8E3"
    stroke-width="16"
  />

  <!-- Inclined Elliptical Orbit Ring around O + Sweeping Trajectory from A through E -->
  <path
    d="M110 124C168 96 238 89 310 91"
    stroke="url(#aeon-orbit-stroke)"
    stroke-width="6.5"
    stroke-linecap="round"
  />
  <ellipse
    cx="412"
    cy="92"
    rx="68"
    ry="22"
    transform="rotate(-36 412 92)"
    stroke="url(#aeon-orbit-stroke)"
    stroke-width="6"
  />

  <!-- Planet X Perihelion Discovery Node on the Upper-Right Orbital Apex -->
  <circle cx="461" cy="56" r="15" fill="url(#px-node-glow)" />
  <circle cx="461" cy="56" r="5.5" fill="#FF5A1F" />

  <!-- Letter N -->
  <path
    d="M518 136V48H535L596 112V48H613V136H596L535 72V136H518Z"
    fill="#ECE8E3"
  />

  <!-- ================= PRECISION ASTROMETRIC GRADUATED RULE ================= -->
  <line x1="92" y1="158" x2="613" y2="158" stroke="#ECE8E3" stroke-opacity="0.28" stroke-width="1" />
  <rect x="92" y="158" width="521" height="8" fill="url(#astrometric-ticks)" />

  <!-- Technical Subtitle -->
  <text
    x="352"
    y="186"
    text-anchor="middle"
    fill="#ECE8E3"
    fill-opacity="0.88"
    font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-size="13.5"
    font-weight="500"
    letter-spacing="4.2"
  >
    ASTROPHYSICAL DISCOVERY OS · SPHEREx &amp; PLANET X
  </text>
</svg>
