name: e2e

# Brings the stack up with Docker Compose and tests every contract path through the Nginx gateway.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths: ["backend/**", "ai-engine/**", "multi-mission-api/**", "deploy/**", "openapi.json"]

permissions:
  contents: read

jobs:
  gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Start stack
        run: |
          PROFILE=""
          [ -f ai-engine/Dockerfile ] && [ -f multi-mission-api/Dockerfile ] && PROFILE="--profile full"
          docker compose -f deploy/docker-compose.yml $PROFILE up -d --build
          for i in $(seq 1 60); do curl -fsS http://localhost/api/v1/health && break; sleep 5; done
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest==8.3.3 httpx==0.27.2 jsonschema==4.23.0
      - run: pytest -q deploy/e2e
        env:
          AEON_GATEWAY_URL: http://localhost
      - if: failure()
        run: docker compose -f deploy/docker-compose.yml logs --tail 200
