# api.a-eon.engineer with Let's Encrypt TLS. Upstreams are resolved lazily so the gateway starts even
# when optional services (ai-engine, multi-mission-api) are not running; their routes return 502.
resolver 127.0.0.11 valid=30s;

server {
    listen 80;
    server_name api.a-eon.engineer;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.a-eon.engineer;

    ssl_certificate     /etc/letsencrypt/live/api.a-eon.engineer/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.a-eon.engineer/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 20m;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    location /api/v1/ai/ {
        set $up http://ai-engine:8100;
        proxy_pass $up;
        proxy_read_timeout 120s;
    }

    location ~ ^/api/v1/(missions|alerts|candidates) {
        set $up http://multi-mission-api:8200;
        proxy_pass $up;
    }

    location / {
        set $up http://backend:8000;
        proxy_pass $up;
        proxy_read_timeout 120s;
    }
}
