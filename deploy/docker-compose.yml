services:
  backend:
    build: ../backend
    restart: unless-stopped
    environment:
      AEON_DATA_DIR: /data/fits
      AEON_CORS_ORIGINS: https://aeon.tech,http://localhost:3000
    volumes:
      - fits-data:/data/fits
    expose: ["8000"]

  ai-engine:
    build: ../ai-engine
    restart: unless-stopped
    env_file: [.env]
    expose: ["8100"]
    profiles: ["full"]

  multi-mission-api:
    build: ../multi-mission-api
    restart: unless-stopped
    env_file: [.env]
    expose: ["8200"]
    profiles: ["full"]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["80:80"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [backend]

volumes:
  fits-data:
