# Production overrides for api.a-eon.engineer (DigitalOcean droplet).
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.prod.yml up -d --build
# Add --profile full once ai-engine/ and multi-mission-api/ exist.
services:
  backend:
    environment:
      AEON_DATA_DIR: /data/fits
      AEON_CORS_ORIGINS: https://a-eon.engineer,https://www.a-eon.engineer
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-www:/var/www/certbot:ro
      - certbot-certs:/etc/letsencrypt:ro
    depends_on:
      backend:
        condition: service_healthy

  certbot:
    image: certbot/certbot:v2.11.0
    volumes:
      - certbot-www:/var/www/certbot
      - certbot-certs:/etc/letsencrypt
    # Renew twice a day; nginx reloads certificates on its own restart cycle (see README).
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'

volumes:
  certbot-www:
    name: aeon-certbot-www        # fixed names so bootstrap-droplet.sh can mount them before compose runs
  certbot-certs:
    name: aeon-certbot-certs
