# api.aeon.tech gateway. TLS is terminated by certbot / DigitalOcean LB in front of this.
resolver 127.0.0.11 valid=30s;

server {
    listen 80;
    server_name api.aeon.tech localhost;
    client_max_body_size 20m;

    location /api/v1/ai/ {
        set $up http://ai-engine:8100;
        proxy_pass $up;
        proxy_read_timeout 120s;
    }

    location ~ ^/api/v1/(missions|alerts|candidates) {
        set $up http://multi-mission-api:8200;
        proxy_pass $up;
    }

    location / {
        set $up http://backend:8000;
        proxy_pass $up;
        proxy_read_timeout 120s;
    }
}
